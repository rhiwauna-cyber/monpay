  <rect x="90" y="25" width="15" height="15" fill="#0f172a"/>
  <rect x="120" y="25" width="30" height="15" fill="#0f172a"/>
  <rect x="90" y="50" width="30" height="15" fill="#0f172a"/>
  <rect x="135" y="50" width="25" height="15" fill="#0f172a"/>
  <rect x="90" y="75" width="15" height="25" fill="#0f172a"/>
  <rect x="120" y="80" width="40" height="20" fill="#0f172a"/>

  <rect x="25" y="90" width="20" height="20" fill="#0f172a"/>
  <rect x="55" y="90" width="20" height="35" fill="#0f172a"/>
  <rect x="25" y="125" width="50" height="15" fill="#0f172a"/>
  <rect x="25" y="150" width="20" height="15" fill="#0f172a"/>

  <rect x="175" y="90" width="20" height="30" fill="#0f172a"/>
  <rect x="205" y="90" width="20" height="15" fill="#0f172a"/>
  <rect x="175" y="130" width="50" height="15" fill="#0f172a"/>
  <rect x="200" y="150" width="25" height="15" fill="#0f172a"/>

  <rect x="90" y="115" width="25" height="25" fill="#0f172a"/>
