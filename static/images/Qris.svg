  <rect x="175" y="180" width="20" height="45" fill="#0f172a"/>
  <rect x="205" y="200" width="20" height="25" fill="#0f172a"/>

  <!-- Center Logo / QRIS Text Badge -->
  <rect x="85" y="98" width="80" height="30" fill="#2563eb" rx="5"/>
  <text x="125" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">QRIS</text>
